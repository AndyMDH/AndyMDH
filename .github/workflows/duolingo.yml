name: Update Duolingo panel

on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render Duolingo SVG
        run: python scripts/render_duolingo_svg.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/duolingo.svg assets/duolingo-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Duolingo panel"
            git push
          fi
